<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="flowGradMain1Favicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BDB2FF" />
      <stop offset="50%" stop-color="#00C2A8" />
      <stop offset="100%" stop-color="#A0C4FF" />
    </linearGradient>
    <linearGradient id="flowGradMain2Favicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C2A8" />
      <stop offset="100%" stop-color="#FFD6A5" />
    </linearGradient>
  </defs>

  <!-- Main Expanded Infinity Flow Loop (Edge-to-Edge) -->
  <path
    d="M 22,50 C 6,24 6,76 22,50 C 38,24 62,76 78,50 C 94,24 94,76 78,50 C 62,24 38,76 22,50 Z"
    fill="none"
    stroke="url(#flowGradMain1Favicon)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 22,50 C 6,24 6,76 22,50 C 38,24 62,76 78,50 C 94,24 94,76 78,50 C 62,24 38,76 22,50 Z"
    fill="none"
    stroke="#1A1A1A"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Overlapping Dashed Asset Stream -->
  <path
    d="M 16,50 C 30,18 70,18 84,50 C 70,82 30,82 16,50"
    fill="none"
    stroke="url(#flowGradMain2Favicon)"
    stroke-width="8"
    stroke-linecap="round"
  />
  <path
    d="M 16,50 C 30,18 70,18 84,50 C 70,82 30,82 16,50"
    fill="none"
    stroke="#1A1A1A"
    stroke-width="3"
    stroke-dasharray="8 5"
    stroke-linecap="round"
  />

  <!-- Left Asset Node -->
  <circle cx="16" cy="50" r="9" fill="#BDB2FF" stroke="#1A1A1A" stroke-width="4" />
  <circle cx="16" cy="50" r="3.2" fill="#1A1A1A" />

  <!-- Core Central Sync Node -->
  <circle cx="50" cy="50" r="12" fill="#00C2A8" stroke="#1A1A1A" stroke-width="4" />
  <circle cx="50" cy="50" r="4.5" fill="#FFFFFF" />

  <!-- Right Asset Node -->
  <circle cx="84" cy="50" r="9" fill="#A0C4FF" stroke="#1A1A1A" stroke-width="4" />
  <circle cx="84" cy="50" r="3.2" fill="#1A1A1A" />

  <!-- Dynamic Flow Arrow Head -->
  <path
    d="M 58,14 L 72,21 L 62,32 Z"
    fill="#FFD6A5"
    stroke="#1A1A1A"
    stroke-width="3"
    stroke-linejoin="round"
  />
</svg>