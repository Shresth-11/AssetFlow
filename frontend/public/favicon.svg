<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="flowGrad1Favicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BDB2FF" />
      <stop offset="100%" stop-color="#00C2A8" />
    </linearGradient>
    <linearGradient id="flowGrad2Favicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C2A8" />
      <stop offset="100%" stop-color="#A0C4FF" />
    </linearGradient>
  </defs>

  <!-- Outer Continuous Infinity Flow Loop -->
  <path
    d="M 32,50 C 18,30 18,70 32,50 C 46,30 54,70 68,50 C 82,30 82,70 68,50 C 54,30 46,70 32,50 Z"
    fill="none"
    stroke="url(#flowGrad1Favicon)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 32,50 C 18,30 18,70 32,50 C 46,30 54,70 68,50 C 82,30 82,70 68,50 C 54,30 46,70 32,50 Z"
    fill="none"
    stroke="#1A1A1A"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Overlapping Asset Stream Pathway -->
  <path
    d="M 28,50 C 38,26 62,26 72,50 C 62,74 38,74 28,50"
    fill="none"
    stroke="url(#flowGrad2Favicon)"
    stroke-width="7"
    stroke-linecap="round"
  />
  <path
    d="M 28,50 C 38,26 62,26 72,50 C 62,74 38,74 28,50"
    fill="none"
    stroke="#1A1A1A"
    stroke-width="2.5"
    stroke-dasharray="7 4"
    stroke-linecap="round"
  />

  <!-- Left Asset Node -->
  <circle cx="28" cy="50" r="7" fill="#BDB2FF" stroke="#1A1A1A" stroke-width="3" />
  <circle cx="28" cy="50" r="2.5" fill="#1A1A1A" />

  <!-- Core Central Sync Node -->
  <circle cx="50" cy="50" r="9" fill="#00C2A8" stroke="#1A1A1A" stroke-width="3.5" />
  <circle cx="50" cy="50" r="3.2" fill="#FFFFFF" />

  <!-- Right Asset Node -->
  <circle cx="72" cy="50" r="7" fill="#A0C4FF" stroke="#1A1A1A" stroke-width="3" />
  <circle cx="72" cy="50" r="2.5" fill="#1A1A1A" />

  <!-- Dynamic Flow Arrow Head -->
  <path
    d="M 54,22 L 65,27 L 57,36 Z"
    fill="#FFD6A5"
    stroke="#1A1A1A"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
</svg>